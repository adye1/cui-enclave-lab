name: PSScriptAnalyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # The lab uses fixed VM names on purpose, so the hardcoded-computer-name rule is excluded.
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingComputerNameHardcoded
          $results | Format-Table RuleName, Severity, ScriptName, Line -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }
